services:
    - type: web
    name: padaria-jequessene
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
            - key: SECRET_KEY
        generateValue: true
            - key: ADMIN_PASSWORD
        value: Jequessene12345